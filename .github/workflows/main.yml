name: Build GsiBox APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  qemu:
    name: Build static QEMU (arm64)
    # arm64 runners are free for public repos. For a private repo, change this to
    # ubuntu-latest and add a docker/setup-qemu-action step (build becomes very slow).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Cache QEMU build
        id: cache
        uses: actions/cache@v4
        with:
          path: qemu-out
          key: qemu-9.1.2-v2

      - name: Build QEMU in Alpine (musl, static)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p qemu-out
          cat > build-qemu.sh <<'SCRIPT_EOF'
          #!/bin/sh
          # Builds a fully static qemu-system-aarch64 (musl) inside an arm64 Alpine container.
          # The result is copied to /w/qemu-out/libqemu.so (named .so so Android installs it
          # into nativeLibraryDir, the only place an app may exec binaries from).
          set -eux

          QEMU_VERSION=9.1.2

          apk add --no-cache \
              build-base linux-headers python3 py3-pip py3-setuptools meson ninja pkgconf \
              flex bison perl bash curl xz tar \
              glib-dev glib-static pixman-dev pixman-static zlib-dev zlib-static \
              pcre2-dev libffi-dev util-linux-dev util-linux-static \
              gettext-dev gettext-static

          # Alpine ships libfdt only as a shared lib; build a static libfdt.a from the dtc sources.
          cd /tmp
          curl -fsSL -o dtc.tar.gz https://git.kernel.org/pub/scm/utils/dtc/dtc.git/snapshot/dtc-1.7.0.tar.gz \
            || curl -fsSL -o dtc.tar.gz https://github.com/dgibson/dtc/archive/refs/tags/v1.7.0.tar.gz
          mkdir dtc-src
          tar xf dtc.tar.gz -C dtc-src --strip-components=1
          cd dtc-src
          make libfdt/libfdt.a
          cp libfdt/libfdt.a /usr/lib/
          cp libfdt/libfdt.h libfdt/fdt.h libfdt/libfdt_env.h /usr/include/
          ls -l /usr/lib/libfdt*

          # Static libslirp (user-mode networking). If this fails, build QEMU without networking.
          cd /tmp
          SLIRP_OPT=--disable-slirp
          if curl -fsSL -o slirp.tar.gz https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.8.0/libslirp-v4.8.0.tar.gz \
             && mkdir slirp-src && tar xf slirp.tar.gz -C slirp-src --strip-components=1 \
             && meson setup slirp-src/build slirp-src --prefix=/usr --libdir=lib --default-library=static \
             && ninja -C slirp-src/build install; then
            SLIRP_OPT=--enable-slirp
          fi
          echo "SLIRP_OPT=$SLIRP_OPT"

          cd /tmp
          curl -fsSL -o qemu.tar.xz "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          tar xf qemu.tar.xz
          cd "qemu-${QEMU_VERSION}"

          ./configure \
              --static \
              --target-list=aarch64-softmmu \
              --disable-docs --disable-tools --disable-guest-agent --disable-user \
              --disable-werror \
              --disable-gtk --disable-sdl --disable-opengl \
              --disable-bzip2 --disable-lzo --disable-snappy --disable-zstd --disable-curl \
              --disable-libssh --disable-gnutls --disable-nettle --disable-gcrypt --disable-vde \
              --disable-brlapi --disable-libusb --disable-libnfs --disable-rbd --disable-fuse \
              --disable-seccomp --disable-numa --disable-libiscsi --disable-smartcard \
              --disable-usb-redir --disable-vnc-sasl --disable-png --disable-glusterfs \
              --enable-fdt=system \
              --disable-curses $SLIRP_OPT

          cd build
          ninja -j"$(nproc)" qemu-system-aarch64
          cd ..

          strip build/qemu-system-aarch64
          ./build/qemu-system-aarch64 --version
          ./build/qemu-system-aarch64 -netdev help | head -n 20 || true

          mkdir -p /w/qemu-out
          cp build/qemu-system-aarch64 /w/qemu-out/libqemu.so
          ls -l /w/qemu-out
          SCRIPT_EOF
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh /w/build-qemu.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: qemu-out/libqemu.so
          if-no-files-found: error

  apk:
    name: Build APK
    needs: qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Gradle project
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              mkdir -p _proj
              unzip -q -o "$Z" -d _proj
              F=$(find _proj -name settings.gradle.kts | head -n 1)
            fi
          fi
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts was not found anywhere in the repo. Upload the project files (settings.gradle.kts, build.gradle.kts, gradle.properties and the app folder)."
            find . -not -path './.git/*' | head -n 50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project directory: $D"
          [ -f "$D/app/build.gradle.kts" ] || { echo "::error::$D/app/build.gradle.kts is missing"; exit 1; }
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: qemu
          path: qemu-dl

      - name: Put QEMU into the app
        run: |
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a"
          cp qemu-dl/libqemu.so "$PROJ/app/src/main/jniLibs/arm64-v8a/libqemu.so"
          ls -l "$PROJ/app/src/main/jniLibs/arm64-v8a"

      - name: Fetch QEMU keymaps (needed by the VNC display)
        run: |
          mkdir -p km-tmp
          curl -fsSL https://download.qemu.org/qemu-9.1.2.tar.xz \
            | tar -xJ -C km-tmp --strip-components=2 qemu-9.1.2/pc-bios/keymaps
          test -e km-tmp/keymaps/en-us
          mkdir -p "$PROJ/app/src/main/assets/qemu-data"
          cp -rL km-tmp/keymaps "$PROJ/app/src/main/assets/qemu-data/keymaps"
          ls "$PROJ/app/src/main/assets/qemu-data/keymaps" | head -n 5

      - name: Build the small fd launcher (starts the KeyMint helper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -static -no-pie -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -fno-tree-loop-distribute-patterns -O2 -Wall -o "$PROJ/app/src/main/jniLibs/arm64-v8a/libfdlaunch.so" "$PROJ/native/fdlaunch.c"
          file "$PROJ/app/src/main/jniLibs/arm64-v8a/libfdlaunch.so"
          file "$PROJ/app/src/main/jniLibs/arm64-v8a/libfdlaunch.so" | grep -q "ARM aarch64"
          ls -l "$PROJ/app/src/main/jniLibs/arm64-v8a"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GsiBox-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
